{% extends 'layout.html' %}

{% block title %}Artículos{% endblock %}

{% block content %}
<h1>Artículos</h1>
<ul>
    {% for articulo in articulos %}
        <li>
            <strong>{{ articulo.title }}</strong>
            <p>{{ articulo.content }}</p>
            <a href="{% url 'editar_articulo' articulo.id %}">Editar</a>
        </li>
    {% empty %}
        <li>No hay artículos todavía.</li>
    {% endfor %}
</ul>
{% endblock %}
