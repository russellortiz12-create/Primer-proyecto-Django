{% extends 'layout.html' %}

{% block title %}Editar artículo{% endblock %}

{% block content %}
<h1>Editar artículo</h1>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    <p>
        <label for="title">Título:</label>
        <input id="title" type="text" name="title" value="{{ articulo.title }}" required>
    </p>
    <p>
        <label for="content">Contenido:</label>
        <textarea id="content" name="content" required>{{ articulo.content }}</textarea>
    </p>
    <p>
        <label>
            <input type="checkbox" name="public" {% if articulo.public %}checked{% endif %}>
            Público
        </label>
    </p>
    <button type="submit">Guardar cambios</button>
</form>
{% endblock %}
