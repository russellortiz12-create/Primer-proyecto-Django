{% load static %}

<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
        {% block title %}
    
        {% endblock %}
        | ADSO SENA
    </title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}"/>
     
</head>
<body>

    <!-- Cabecera de la pagina-->
    <header>
        <div id="logotipo">
            <!-- logo Django-->
            <img src="{% static 'images/django_logo.png' %}" />
            <h1> Sitio WEB con Django </h1>
        </div>
    </header>

    <nav>
        <ul>
            <li>
                <a href="{% url 'inicio' %}">Inicio</a>
            </li>
            <li>
                <a href="{% url 'articulos' %}">Articulos</a>
            </li>
            <li>
                <a href="{% url 'hola_mundo' %}">Hola Mundo</a>
            </li>
            <li>
                <a href="{% url 'pagina' %}">Página de Pruebas</a>
            </li>
            <li>
                <a href="{% url 'contacto' %}">Contacto</a>
            </li>
        </ul>
    </nav>

    <div id="content">
        <div class="box">
             <h1 class="title"Titulo de prueba></h1>
            {% block content %}
            <!-- Código que viene de los templates -->
            <strong>Contenido del bloque original</strong>
            {% endblock %}
        </div>
       
    </div>
    <hr>
    <footer>
        CURSO DE PYTHON &COPY; ADSO SENA - {% now "d/m/Y"%}
    </footer>
</body> 
</html>
